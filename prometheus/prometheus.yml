global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'nexus-monitor'
    environment: 'development'

rule_files:
  - '/etc/prometheus/alerts/*.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Nexus Daemon (when metrics endpoint is implemented)
  - job_name: 'nexus-daemon'
    static_configs:
      - targets: ['host.docker.internal:9091']   # Change to actual nexus-daemon metrics port
    scrape_interval: 10s
    metrics_path: /metrics

  # Node Exporter (host metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Future: Yggdrasil, XCoin node, AI agents, etc.
  # - job_name: 'yggdrasil'
  # - job_name: 'xcoin'
